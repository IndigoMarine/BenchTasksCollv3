name: Assemble finalpool from Task Tracker

on:
  push:
    branches: [finalpool]
    paths: ['.github/workflows/assemble-finalpool.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-finalpool
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == 'refs/heads/finalpool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 1
      - name: Copy only the 54 tasks marked implemented in Notion
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          # Immutable developer branch snapshots, matched against Task Tracker.
          # Copy Git trees without executing or modifying any task code.
          sources = [
              ('fan-dev', '8b90f34538e4e106eba103265efaa9a456be498c', 'fan', 'coupon-manager price-tracker'),
              ('gyy', '9612ffff37072726292c77df0f4c6db2f8df1bbb', 'gyy', 'blog-engine cms-builder content-scheduler social-publisher'),
              ('haoze', 'e0072cf979548c56984072cd76f529c7beea59b2', 'haoze', 'subtitle-generator video-trimmer'),
              ('jl_dev', '4e2b63f5dafce88b60886ed6e6af7bd9a8966296', 'jl', 'canvas-grade-automation email-classification-system pdf-report-generator'),
              ('junteng_dev', '4ab0c5415824d799c3457a26482f9b794c7e9e93', 'junteng', 'booking-system calendar-sync contact-manager order-processor product-catalog reminder-service shipment-tracker'),
              ('junxian_dev', '96bbc11b6fc701d07d961aaf070c434fccd1794f', 'junxian', 'qr-generator translation-api'),
              ('lueyang-dev', 'bf8b9a1d25edd81b158db0bb7f49d8624348e74d', 'lueyang', 'activity-logger crm-system deal-manager email-campaign follow-up-reminder sales-pipeline'),
              ('lv', '0be3288e0fd4ae1f241d3ce9cc1c864ae2606d37', 'lv', 'chat-bot feedback-collector personalization-service sentiment-analyzer voice-processor'),
              ('ruige', 'a6f3fba387f68acaf6517803e88b40a4a3c52658', 'ruige', 'canvas-automation data-analytics expense-tracker file-manager'),
              ('wenshuo-dev', 'd11080ed8d65fb72eb32d9353cb20844b593f9e8', 'wenshuo', 'image-processor search-engine'),
              ('xiaochen_dev', '20bfc73490dcf4029b92123b6055e076b7eb5dfa', 'xiaochen', 'backup-utility deployment-tool error-tracker monitoring-agent security-scanner'),
              ('yuxuan-dev', 'e82c8295f9506ced6862ab7f39048a731b48beb4', 'yuxuan', 'asset-optimizer content-manager network-analyzer task-scheduler'),
              ('yuzhen-dev', 'c68265dafe0a0eccc6e183ff96d1a3e5591a3d8b', 'yuzhen', 'alert-system data-validator form-builder invoice-generator payment-processor permission-manager'),
              ('zhaochen', 'b5f9cc4f79bb9218e40c0293ab9ec4e90352a626', 'zhaochen', 'load-balancer template-engine'),
          ]
          assert git('branch', '--show-current') == 'finalpool'
          assert not git('ls-tree', 'HEAD', 'tasks/finalpool'), 'Refusing to replace an existing pool'
          expected = {}
          for branch, sha, developer, task_names in sources:
              git('fetch', '--no-tags', '--depth=1', 'origin', sha)
              for name in task_names.split():
                  assert name not in expected, f'Duplicate task name: {name}'
                  source = f'tasks/{developer}/{name}'
                  tree = git('rev-parse', f'{sha}:{source}')
                  assert git('cat-file', '-t', tree) == 'tree'
                  destination = f'tasks/finalpool/{name}'
                  git('read-tree', f'--prefix={destination}/', tree)
                  expected[name] = tree
                  print(f'{branch}:{source} -> {destination} [{tree}]', flush=True)
          assert len(expected) == 54
          root = git('write-tree')
          actual_names = set(git('ls-tree', '--name-only', f'{root}:tasks/finalpool').splitlines())
          assert actual_names == set(expected), 'Pool membership differs from Notion'
          for name, tree in expected.items():
              assert git('rev-parse', f'{root}:tasks/finalpool/{name}') == tree, f'Tree mismatch: {name}'
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert changed and all(p.startswith('tasks/finalpool/') for p in changed)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'Collect all 54 tasks marked implemented in Notion Task Tracker')
          git('push', 'origin', 'HEAD:refs/heads/finalpool')
          print(f'Verified and published {len(expected)} exact task trees ({len(changed)} files).', flush=True)
          print('Commit: ' + git('rev-parse', 'HEAD'), flush=True)
          PY
